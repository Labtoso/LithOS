[package]
name = "lithos-center"
version = "1.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "LithOS Welcome and Settings"

[dependencies]
cxx = "1.0.95"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = { version = "0.7", features = ["link_qt_object_files"] }

[profile.release]
opt-level = 2
strip = true
