It allows you to install LithOS or perform system maintenance.
ENDTEXT
MENU LABEL LithOS install medium (%ARCH%, HTTP)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lithos
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lithos.img
