LABEL arch_nbd
TEXT HELP
Boot the LithOS install medium using NBD.
It allows you to install LithOS or perform system maintenance.
ENDTEXT
MENU LABEL LithOS install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lithos
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lithos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y %KERNEL_PARAMS%
SYSAPPEND 3

LABEL arch_nfs
TEXT HELP
Boot the LithOS live medium using NFS.
It allows you to install LithOS or perform system maintenance.
ENDTEXT
MENU LABEL LithOS install medium (%ARCH%, NFS)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lithos
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lithos.img
APPEND archisobasedir=%INSTALL_DIR% archiso_nfs_srv=${pxeserver}:/run/archiso/bootmnt cms_verify=y %KERNEL_PARAMS%
SYSAPPEND 3

LABEL arch_http
TEXT HELP
