LABEL lithos
TEXT HELP
LithOS starten (Deutsch)
ENDTEXT
MENU LABEL LithOS starten (Deutsch)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% lithos.lang=de cow_spacesize=50% quiet splash loglevel=3 %KERNEL_PARAMS%

