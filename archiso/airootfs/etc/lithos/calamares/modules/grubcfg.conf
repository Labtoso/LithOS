---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet", "splash", "nowatchdog", "slab_nomerge", "page_alloc.shuffle=1", "randomize_kstack_offset=on", "vsyscall=none", "debugfs=off" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: false
    GRUB_DISABLE_OS_PROBER: false
    GRUB_DISABLE_RECOVERY: true
always_use_defaults: true
