---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - wheel
    - video
    - audio
    - input
    - network
    - storage
    - lp
    - rfkill
    - sys
doAutologin: false
sudoersGroup: wheel
setRootPassword: true
doReusePassword: true
passwordRequirements:
    minLength: 4
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /usr/bin/fish
  forbidden_names: [ root, lithos ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "lithos-${cpu}"
